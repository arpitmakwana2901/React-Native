# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# Tweaked memory settings for fast React Native compilation.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC

# Enable Gradle Daemon for fast build startup
org.gradle.daemon=true

# Enable parallel compilation across subprojects
org.gradle.parallel=true

# Enable build caching to reuse unchanged outputs
org.gradle.caching=true

# Enable Kotlin incremental compilation
kotlin.incremental=true

# Enable File System Watching for fast file change detection
org.gradle.vfs.watch=true

# AndroidX package structure
android.useAndroidX=true

# React Native target architectures (x86_64 for emulators, arm64-v8a for real devices)
reactNativeArchitectures=arm64-v8a,x86_64

# Use this property to enable support to the new architecture.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
android.builtInKotlin=false
android.newDsl=false